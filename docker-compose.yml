services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: "Host=host.docker.internal;Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:?POSTGRES_DB must be set in .env};Username=${POSTGRES_USER:?POSTGRES_USER must be set in .env};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      Jwt__Issuer: ${JWT_ISSUER:-TaskManager}
      Jwt__Audience: ${JWT_AUDIENCE:-TaskManagerClient}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      Jwt__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS:-7}
      Cors__AllowedOrigins__0: "http://localhost:${FRONTEND_PORT:-4200}"
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        API_URL: ${API_BASE_URL:-http://localhost:5000/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4200}:80"
