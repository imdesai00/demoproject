<div class="cursor-grab rounded-lg border border-surface-200 bg-white p-3 shadow-sm transition hover:border-brand-300 active:cursor-grabbing">
  <div class="flex items-start justify-between gap-2">
    <h4 class="text-sm font-medium text-surface-800">{{ task.title }}</h4>
    <app-priority-badge [priority]="task.priority" />
  </div>

  @if (task.description) {
    <p class="mt-1 line-clamp-2 text-xs text-surface-500">{{ task.description }}</p>
  }

  <div class="mt-3 flex items-center justify-between">
    @if (task.dueDate) {
      <span class="text-xs" [class.text-rose-600]="isOverdue" [class.text-surface-400]="!isOverdue">
        Due {{ task.dueDate | date: 'MMM d' }}
      </span>
    } @else {
      <span></span>
    }

    <div class="flex gap-1">
      <button
        type="button"
        (click)="edit.emit(task)"
        class="rounded px-1.5 py-0.5 text-xs text-surface-500 hover:bg-surface-100 hover:text-surface-700"
      >
        Edit
      </button>
      <button
        type="button"
        (click)="delete.emit(task)"
        class="rounded px-1.5 py-0.5 text-xs text-surface-500 hover:bg-rose-50 hover:text-rose-600"
      >
        Delete
      </button>
    </div>
  </div>
</div>
